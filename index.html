  <style>html,body{margin:0;width:100%;height:100%;background:#080808;overflow:hidden}</style>

<body>
<script>
(async function(){
  try {
    const res = await fetch('/prelaunch.html', { cache: 'no-store', credentials: 'same-origin' });
    if (!res.ok) throw new Error('Prelaunch page unavailable');
    const html = await res.text();
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#080808;color:#f5f5f0;font:600 16px system-ui;padding:24px;text-align:center">22.09 is loading. Please refresh.</div>';
  }
})();
</script>
</body>
