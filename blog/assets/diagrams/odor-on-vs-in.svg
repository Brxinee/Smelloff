<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d">
  <title id="t">Odor on clothes versus odor in clothes</title>
  <desc id="d">Surface odor sits loosely and airs off. Bound odor is lipid and oxidation products held inside the fibre and comes back with heat and moisture.</desc>
  <rect width="1600" height="720" fill="#080808"/>
  <text x="80" y="64" fill="#B8FF57" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="4">ON THE CLOTH · IN THE FIBRE</text>
  <g>
    <rect x="80" y="120" width="680" height="500" rx="6" fill="#111" stroke="#2A2A2A"/>
    <text x="120" y="190" fill="#B8FF57" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="3">ON</text>
    <text x="120" y="250" fill="#F4F1EA" font-family="Georgia, serif" font-size="42">Loose volatiles</text>
    <text x="120" y="330" fill="#9A958D" font-family="Georgia, serif" font-size="24">Smoke, kitchen haze, last</text>
    <text x="120" y="368" fill="#9A958D" font-family="Georgia, serif" font-size="24">night’s room. Sits on the</text>
    <text x="120" y="406" fill="#9A958D" font-family="Georgia, serif" font-size="24">surface. Airing helps.</text>
    <text x="120" y="480" fill="#F4F1EA" font-family="Georgia, serif" font-size="22">A dry garment, a window, time.</text>
  </g>
  <g>
    <rect x="840" y="120" width="680" height="500" rx="6" fill="#111" stroke="#2A2A2A"/>
    <text x="880" y="190" fill="#B8FF57" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="3">IN</text>
    <text x="880" y="250" fill="#F4F1EA" font-family="Georgia, serif" font-size="42">Bound residue</text>
    <text x="880" y="330" fill="#9A958D" font-family="Georgia, serif" font-size="24">Sebum, lipid-oxidation, the</text>
    <text x="880" y="368" fill="#9A958D" font-family="Georgia, serif" font-size="24">pit seam. Lives in the yarn.</text>
    <text x="880" y="406" fill="#9A958D" font-family="Georgia, serif" font-size="24">Heat and moisture wake it.</text>
    <text x="880" y="480" fill="#F4F1EA" font-family="Georgia, serif" font-size="22">Wash the zone, or quiet it dry.</text>
  </g>
</svg>
