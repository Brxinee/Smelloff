<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d">
  <title id="t">The fabric odor stack: trap, quiet, slow, deliver</title>
  <desc id="d">Four layers a clothing mist actually uses: HPβCD cages the odorant, Zinc PCA quiets volatile acids, triethyl citrate slows the next batch, water and alcohol deliver then leave.</desc>
  <rect width="1600" height="720" fill="#080808"/>
  <text x="80" y="64" fill="#B8FF57" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="4">THE STACK · NOT A COVER SCENT</text>
  <g font-family="Georgia, 'Times New Roman', serif">
    <g>
      <rect x="80" y="110" width="340" height="480" rx="6" fill="#111" stroke="#2A2A2A"/>
      <text x="110" y="168" fill="#B8FF57" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="3">01  TRAP</text>
      <text x="110" y="230" fill="#F4F1EA" font-size="36">HPβCD</text>
      <text x="110" y="280" fill="#9A958D" font-size="20">Cages the molecule</text>
      <text x="110" y="330" fill="#9A958D" font-size="20">so it cannot reach</text>
      <text x="110" y="380" fill="#9A958D" font-size="20">a nose.</text>
    </g>
    <g>
      <rect x="450" y="110" width="340" height="480" rx="6" fill="#111" stroke="#2A2A2A"/>
      <text x="480" y="168" fill="#B8FF57" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="3">02  QUIET</text>
      <text x="480" y="230" fill="#F4F1EA" font-size="36">Zinc PCA</text>
      <text x="480" y="280" fill="#9A958D" font-size="20">Binds volatile sweat</text>
      <text x="480" y="330" fill="#9A958D" font-size="20">acids so they are</text>
      <text x="480" y="380" fill="#9A958D" font-size="20">less willing to fly.</text>
    </g>
    <g>
      <rect x="820" y="110" width="340" height="480" rx="6" fill="#111" stroke="#2A2A2A"/>
      <text x="850" y="168" fill="#B8FF57" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="3">03  SLOW</text>
      <text x="850" y="230" fill="#F4F1EA" font-size="36">Citrate</text>
      <text x="850" y="280" fill="#9A958D" font-size="20">Interferes with the</text>
      <text x="850" y="330" fill="#9A958D" font-size="20">next pulse of odor</text>
      <text x="850" y="380" fill="#9A958D" font-size="20">on the fibre.</text>
    </g>
    <g>
      <rect x="1190" y="110" width="340" height="480" rx="6" fill="#111" stroke="#2A2A2A"/>
      <text x="1220" y="168" fill="#B8FF57" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="3">04  LEAVE</text>
      <text x="1220" y="230" fill="#F4F1EA" font-size="36">Solvent</text>
      <text x="1220" y="280" fill="#9A958D" font-size="20">Water + IPA carry</text>
      <text x="1220" y="330" fill="#9A958D" font-size="20">the stack in, then</text>
      <text x="1220" y="380" fill="#9A958D" font-size="20">flash off ~10s.</text>
    </g>
  </g>
  <text x="80" y="660" fill="#5C5A55" font-family="ui-monospace, Menlo, monospace" font-size="16">Fragrance, if present, is a finish that should fade. It is not a layer in this map.</text>
</svg>
