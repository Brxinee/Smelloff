name: Apply checkout purchase state fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-checkout-state.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch checkout.js
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('assets/js/checkout.js')
          s = path.read_text()

          if 'const purchaseState = {' not in s:
              needle = "  let currentVariant = 'solo';\n"
              if needle not in s:
                  raise SystemExit('currentVariant anchor not found')
              insert = needle + "  // Canonical purchase state shared by pack, quantity, payment method and totals.\n  const purchaseState = { variant: 'solo', quantity: 1, paymentMethod: 'prepaid' };\n  function syncPurchaseState() {\n    const q = Math.max(1, Math.min(5, Number(purchaseState.quantity) || 1));\n    purchaseState.quantity = q;\n    if (purchaseState.paymentMethod !== 'cod') purchaseState.paymentMethod = 'prepaid';\n    if (!['solo', 'duo', 'trio'].includes(purchaseState.variant)) {\n      purchaseState.variant = q === 3 ? 'trio' : q === 2 ? 'duo' : 'solo';\n    }\n    currentVariant = purchaseState.variant;\n    cartQty = q;\n    payMethod = purchaseState.paymentMethod;\n  }\n"
              s = s.replace(needle, insert, 1)

          # Make the existing arithmetic consume canonical state first.
          needle = "  function orderTotals() {\n    const qty = cartQty > 0 ? cartQty : 1;"
          repl = "  function orderTotals() {\n    syncPurchaseState();\n    const qty = purchaseState.quantity > 0 ? purchaseState.quantity : 1;"
          if needle in s:
              s = s.replace(needle, repl, 1)

          # Replace the stale buyNow implementation with pack-aware canonical state.
          old = "  function buyNow() {\n    setCartQty(Math.max(1, Math.min(5, pdpQty)));\n    trackAddToCart();\n    smfCartBeacon('add_to_cart');\n    closeCartDrawer();\n    openCheckout('solo');\n  }"
          new = "  function buyNow() {\n    const qty = Math.max(1, Math.min(5, Number(pdpQty) || 1));\n    purchaseState.quantity = qty;\n    purchaseState.variant = qty === 3 ? 'trio' : qty === 2 ? 'duo' : 'solo';\n    syncPurchaseState();\n    setCartQty(qty);\n    trackAddToCart();\n    smfCartBeacon('add_to_cart');\n    closeCartDrawer();\n    openCheckout(purchaseState.variant);\n  }"
          if old not in s:
              raise SystemExit('buyNow anchor not found')
          s = s.replace(old, new, 1)

          # Update openCheckout to establish canonical pack/quantity state.
          pattern = r"(  function openCheckout\(variant\) \{\n    _checkoutTrigger = document\.activeElement;\n    currentVariant = variant;)"
          repl = r"\1\n    purchaseState.variant = ['solo', 'duo', 'trio'].includes(variant) ? variant : (cartQty === 3 ? 'trio' : cartQty === 2 ? 'duo' : 'solo');\n    purchaseState.quantity = purchaseState.variant === 'trio' ? 3 : purchaseState.variant === 'duo' ? 2 : Math.max(1, Math.min(5, cartQty || 1));\n    purchaseState.paymentMethod = payMethod === 'cod' ? 'cod' : 'prepaid';\n    syncPurchaseState();"
          s2, n = re.subn(pattern, repl, s, count=1)
          if n != 1:
              raise SystemExit('openCheckout anchor not found')
          s = s2

          # Update selectPay so payment method is canonical.
          needle = "  function selectPay(method) {"
          if needle not in s:
              raise SystemExit('selectPay anchor not found')
          s = s.replace(needle, needle + "\n    purchaseState.paymentMethod = method === 'cod' ? 'cod' : 'prepaid';", 1)

          # Ensure canonical state stays aligned after cart mutations.
          replacements = {
              "  function cartInc() { var next = Math.min(5, getCartQty() + 1); setCartQty(next); syncPdpQtyFromCart(); smfCartBeacon('cart_update'); }":
              "  function cartInc() { var next = Math.min(5, getCartQty() + 1); setCartQty(next); syncPdpQtyFromCart(); purchaseState.quantity = next; purchaseState.variant = next === 3 ? 'trio' : next === 2 ? 'duo' : 'solo'; syncPurchaseState(); smfCartBeacon('cart_update'); }",
              "  function cartDec() { var q = getCartQty(); if (q <= 1) setCartQty(0); else setCartQty(q - 1); syncPdpQtyFromCart(); smfCartBeacon('cart_update'); }":
              "  function cartDec() { var q = getCartQty(); var next = q <= 1 ? 0 : q - 1; if (q <= 1) setCartQty(0); else setCartQty(next); syncPdpQtyFromCart(); if (next > 0) { purchaseState.quantity = next; purchaseState.variant = next === 3 ? 'trio' : next === 2 ? 'duo' : 'solo'; } syncPurchaseState(); smfCartBeacon('cart_update'); }",
              "  function cartRemove() { setCartQty(0); syncPdpQtyFromCart(); smfCartBeacon('remove_from_cart'); }":
              "  function cartRemove() { setCartQty(0); syncPdpQtyFromCart(); purchaseState.quantity = 1; purchaseState.variant = 'solo'; syncPurchaseState(); smfCartBeacon('remove_from_cart'); }",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)

          # Keep payment state in the existing UI render path.
          if 'purchaseState.paymentMethod' not in s:
              raise SystemExit('purchaseState payment state missing after patch')

          path.write_text(s)

      - name: Validate JavaScript syntax
        run: node --check assets/js/checkout.js

      - name: Verify purchase state and commercial totals
        shell: bash
        run: |
          grep -q "const purchaseState = {" assets/js/checkout.js
          grep -q "purchaseState.variant" assets/js/checkout.js
          grep -q "purchaseState.paymentMethod" assets/js/checkout.js
          grep -q "function orderTotals()" assets/js/checkout.js
          grep -q "function buyNow()" assets/js/checkout.js
          echo 'checkout purchase-state checks passed'

      - name: Commit checkout fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/checkout.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(checkout): single purchase state for pack, payment, and totals"
          git push
