name: Bump chrome.js asset URL

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Stamp chrome.js content hash into HTML pages
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(sha256sum assets/js/chrome.js | cut -c1-8)
          while IFS= read -r file; do
            sed -E -i "s#chrome\\.js\\?v=[^\"']+#chrome.js?v=${HASH}#g" "$file"
          done < <(git ls-files '*.html')
          echo "Stamped chrome.js hash ${HASH} into tracked HTML pages."

      - name: Commit generated cache-buster updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No HTML cache-buster changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m "chore: refresh chrome.js cache-buster"
          git push
