# Push every sitemap URL to IndexNow after a deploy, so Bing / Copilot /
# Yandex / Naver learn about a new or changed page instead of waiting to
# recrawl. Google does NOT participate in IndexNow — for Google the levers are
# the sitemap in robots.txt and internal linking, both already in place.
#
# It waits before firing: the push to main is what triggers the Cloudflare Workers build, so
# submitting immediately would point crawlers at the OLD deploy. The step below
# polls the live sitemap until it matches the commit being deployed, then pings.
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      # Only content changes are worth a submission. Skip docs/scripts/CI churn.
      - '**.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'personal-site/**'   # /NikhilPatil is built from here at deploy
  workflow_dispatch:        # allow a manual re-submit

# One at a time; a queued run would submit a sitemap that is about to change.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cloudflare Workers Builds deploys from the same push. Wait for the deploy to actually serve
      # this commit's sitemap before telling anyone to come and read it.
      - name: Wait for this commit to go live
        run: |
          # /api/health reports the deployed commit (first 12 characters).
          want="${GITHUB_SHA:0:12}"
          for i in $(seq 1 45); do
            live=$(curl -sS --max-time 20 https://smelloff.in/api/health | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || true)
            echo "  attempt $i: live commit ${live:-unknown}, want $want"
            [ "$live" = "$want" ] && exit 0
            sleep 20
          done
          echo "::warning::the deploy never reported this commit; pinging anyway"

      - name: Submit to IndexNow
        run: node scripts/indexnow-ping.mjs
