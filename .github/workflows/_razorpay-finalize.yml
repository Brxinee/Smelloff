name: Finalize Razorpay checkout assets

on:
  push:
    branches: [razorpay-standard-checkout]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate
        run: |
          node --check assets/js/chrome.js
          node --check api/create-order.js
          node --check api/verify-payment.js
          npm test
      - name: Refresh shared chrome hashes
        run: node scripts/apply-chrome.mjs
      - name: Commit generated hashes and remove helper
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git rm .github/workflows/_razorpay-finalize.yml
          git commit -m 'chore: refresh Razorpay checkout asset hashes'
          git push
