name: Compact checkout payment selector

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  compact-payment-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compact payment selector without touching Razorpay flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          path = Path('assets/js/chrome.js')
          before = path.read_text(encoding='utf-8')

          inject_marker = 'function injectPaymentStyles()'
          razor_marker = 'function startRazorpay()'
          assert before.count(inject_marker) == 1, 'injectPaymentStyles marker missing/duplicated'
          assert before.count(razor_marker) == 1, 'startRazorpay marker missing/duplicated'

          prefix_before = before[:before.index(inject_marker)]
          razor_tail_before = before[before.index(razor_marker):]

          css_start = before.index('style.textContent = `', before.index(inject_marker)) + len('style.textContent = `')
          css_end = before.index('`;', css_start)
          compact_css = r'''\n      .smf-payment-choice{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);}\n      .smf-payment-choice__label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}\n      .smf-payment-choice__options{display:grid;grid-template-columns:1fr 1fr;gap:8px;}\n      .smf-pay-opt{\n        min-height:56px;padding:10px 12px;\n        border:1px solid var(--rule);border-radius:6px;\n        background:rgba(255,255,255,.025);color:var(--text);\n        cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;\n        font-family:var(--mono);transition:background .16s,border-color .16s,transform .12s;\n        -webkit-tap-highlight-color:transparent;\n      }\n      .smf-pay-opt:hover{border-color:var(--rule-strong);}\n      .smf-pay-opt:active{transform:scale(.985);}\n      .smf-pay-opt[aria-checked="true"]{background:var(--acid);border-color:var(--acid);color:var(--ink);}\n      .smf-pay-opt__title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1;}\n      .smf-pay-opt__price{font-family:var(--display);font-size:19px;font-weight:900;line-height:1;letter-spacing:-.02em;white-space:nowrap;}\n      @media(max-width:360px){\n        .smf-payment-choice{margin-top:14px;padding-top:12px;}\n        .smf-payment-choice__options{gap:6px;}\n        .smf-pay-opt{min-height:52px;padding:9px 10px;}\n        .smf-pay-opt__title{font-size:11px;}\n        .smf-pay-opt__price{font-size:18px;}\n      }\n    '''
          after_css = before[:css_start] + compact_css + before[css_end:]

          choice_anchor = after_css.index('choice.innerHTML = `', after_css.index('function ensurePaymentUi()'))
          html_start = choice_anchor + len('choice.innerHTML = `')
          html_end = after_css.index('`;', html_start)
          compact_html = r'''\n        <div class="smf-payment-choice__label">Payment</div>\n        <div class="smf-payment-choice__options" role="radiogroup" aria-label="Choose payment method">\n          <button type="button" class="pay-opt smf-pay-opt" data-method="prepaid" role="radio" aria-checked="true">\n            <span class="smf-pay-opt__title">Pay</span>\n            <span class="smf-pay-opt__price">₹229</span>\n          </button>\n          <button type="button" class="pay-opt smf-pay-opt" data-method="cod" role="radio" aria-checked="false">\n            <span class="smf-pay-opt__title">COD</span>\n            <span class="smf-pay-opt__price">₹289</span>\n          </button>\n        </div>\n      '''
          after_html = after_css[:html_start] + compact_html + after_css[html_end:]

          panel_re = re.compile(
              r"\n      var upiPanel = document\.createElement\('div'\);.*?"
              r"\n      error\.parentNode\.insertBefore\(codPanel, error\);\n",
              re.S,
          )
          after_panels, panel_count = panel_re.subn('\n', after_html, count=1)
          assert panel_count == 1, 'Expected exactly one verbose payment panel block'

          modes_re = re.compile(
              r"\n    var modes = document\.querySelector\('\.pay-modes'\);\n"
              r"    if \(modes\) modes\.textContent = method === 'cod'\n"
              r"      \? 'Cash on Delivery · Pay on delivery · ₹60 handling'\n"
              r"      : 'Secure Razorpay Checkout · UPI / Cards / Netbanking';\n",
              re.S,
          )
          after_modes, modes_count = modes_re.subn(
              "\n    var modes = document.querySelector('.pay-modes');\n"
              "    if (modes) modes.textContent = method === 'cod'\n"
              "      ? 'COD · ₹60 handling'\n"
              "      : 'UPI · Cards · Netbanking';\n",
              after_panels,
              count=1,
          )
          assert modes_count == 1, 'Payment mode text block drifted unexpectedly'

          reassure_re = re.compile(
              r"\n    var reassure = document\.querySelector\('\.checkout-reassure'\);\n"
              r"    if \(reassure\) reassure\.textContent = method === 'cod'\n"
              r"      \? 'No payment now · COD confirmation by phone · ₹60 handling included'\n"
              r"      : '🔒 Secure Razorpay checkout · UPI, Cards, Netbanking & More';\n",
              re.S,
          )
          after_reassure, reassure_count = reassure_re.subn(
              "\n    var reassure = document.querySelector('.checkout-reassure');\n"
              "    if (reassure) reassure.textContent = method === 'cod'\n"
              "      ? '₹60 handling · Pay on delivery'\n"
              "      : 'Secure Razorpay checkout';\n",
              after_modes,
              count=1,
          )
          assert reassure_count == 1, 'Checkout reassurance text block drifted unexpectedly'

          after = after_reassure

          assert after.startswith(prefix_before), 'Unexpected change before payment UI function'
          assert after[after.index(razor_marker):] == razor_tail_before, 'Razorpay execution path was modified'
          assert after.count('function startRazorpay()') == 1
          assert 'rzp.open();' in after
          assert 'verifyStandardPayment' in after
          assert 'razorpay_payment_id' in after
          assert 'razorpay_signature' in after

          path.write_text(after, encoding='utf-8')
          print('chrome.js:', len(before), '->', len(after), 'bytes')
          print('Razorpay tail preserved byte-for-byte from startRazorpay().')
          print('chrome.js sha256:', hashlib.sha256(after.encode()).hexdigest())
          PY

      - name: JavaScript syntax check
        run: node --check assets/js/chrome.js

      - name: Refresh chrome.js cache-buster in tracked HTML
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(sha256sum assets/js/chrome.js | cut -c1-8)
          while IFS= read -r file; do
            sed -E -i "s#chrome\\.js\\?v=[^\"']+#chrome.js?v=${HASH}#g" "$file"
          done < <(git ls-files '*.html')
          echo "Stamped chrome.js hash ${HASH} into tracked HTML pages."

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/compact-payment-ui.yml

      - name: Commit compact UI and cache-busters
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes produced; refusing to create a no-op commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/chrome.js '*.html' .github/workflows/compact-payment-ui.yml
          git commit -m "feat: compact checkout payment selector"
          git push
