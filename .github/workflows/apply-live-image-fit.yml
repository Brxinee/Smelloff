name: Apply live image-fit fix

on:
  push:
    paths:
      - '.github/workflows/apply-live-image-fit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch live image rendering and cache bust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path('assets/css/chrome.css')
          text = css.read_text(encoding='utf-8')
          text += '''\n\n/* LIVE IMAGE FIT — full source photography, never crop. */\n.so-media img{\n  width:100% !important;\n  height:auto !important;\n  max-height:none !important;\n  object-fit:initial !important;\n  object-position:center !important;\n  display:block !important;\n}\n.so-media{\n  height:auto !important;\n  min-height:0 !important;\n}\n'''
          css.write_text(text, encoding='utf-8')

          for path in Path('.').rglob('*.html'):
              s = path.read_text(encoding='utf-8')
              s2 = re.sub(r'chrome\.css\?v=[A-Za-z0-9_-]+', 'chrome.css?v=fullfit20260904', s)
              if s2 != s:
                  path.write_text(s2, encoding='utf-8')

          sw = Path('sw.js')
          s = sw.read_text(encoding='utf-8')
          s = re.sub(r"const VERSION = '[^']+';", "const VERSION = 'smelloff-v31-fullfit';", s, count=1)
          sw.write_text(s, encoding='utf-8')
          PY

      - name: Clean workflow and commit
        run: |
          rm -f .github/workflows/apply-live-image-fit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/chrome.css sw.js '*.html' blog/*.html .github/workflows/apply-live-image-fit.yml
          git commit -m 'Fix live image cropping and bust CSS cache'
          git push
