name: Fix full image fit

on:
  push:
    paths-ignore:
      - 'assets/css/chrome.css'
      - '.github/workflows/fix-image-fit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply image framing override
        run: |
          cat >> assets/css/chrome.css <<'CSS'

          /* FINAL REAL-PHOTO FRAMING — fill width, crop only top/bottom. */
          .so-media{
            width:100% !important;
            aspect-ratio:4 / 5 !important;
            overflow:hidden !important;
            border:0 !important;
            border-radius:0 !important;
            background:transparent !important;
          }
          .so-media picture{
            display:block !important;
            width:100% !important;
            height:100% !important;
          }
          .so-media img{
            width:100% !important;
            height:100% !important;
            max-height:none !important;
            object-fit:cover !important;
            object-position:center !important;
            display:block !important;
          }
          CSS

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/chrome.css
          git commit -m 'Fix real-photo framing without side bars'
          git push