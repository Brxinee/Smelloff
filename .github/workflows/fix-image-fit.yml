name: Keep product photos cover-cropped

on:
  push:
    paths:
      - 'assets/css/chrome.css'
      - '.github/workflows/fix-image-fit.yml'
      - 'scripts/qa/.image-fit-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip letterbox override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/css/chrome.css')
          css = path.read_text(encoding='utf-8')
          new = re.sub(r'\n/\* FINAL PRODUCT IMAGE PRESERVATION.*\Z', '', css, flags=re.S)
          new = re.sub(r'\n/\* FINAL REAL-PHOTO FRAMING.*\Z', '', new, flags=re.S)
          if new != css:
              path.write_text(new, encoding='utf-8')
          PY

      - name: Commit only when needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- assets/css/chrome.css; then
            echo 'Cover crop already last in cascade.'
            exit 0
          fi
          git add assets/css/chrome.css
          git commit -m 'Remove letterbox override so product photos fill the frame'
          git push
