name: Fix full image fit

on:
  push:
    paths-ignore:
      - 'assets/css/chrome.css'
      - '.github/workflows/fix-image-fit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refine content image framing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/css/chrome.css')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\.so-media\{.*?\n\}\n\.so-media picture\{.*?\n\}\n\.so-media img\{.*?\n\}\n@media\(min-width:768px\)\{.*?\n\}\n',
              re.S,
          )

          new = '''.so-media{
  margin:0;
  width:100%;
  aspect-ratio:4 / 5;
  overflow:hidden;
  border-radius:0;
  border:0;
  background:transparent;
}
.so-media picture{
  display:block;
  width:100%;
  height:100%;
}
.so-media img{
  width:100%;
  height:100%;
  max-height:none;
  display:block;
  object-fit:cover;
  object-position:center;
  border-radius:0;
}
@media(min-width:768px){
  .so-media{
    aspect-ratio:4 / 5;
  }
}
'''

          updated, count = pattern.subn(new, text, count=1)
          if count != 1:
              raise SystemExit('Expected .so-media block not found; refusing to edit blindly.')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/chrome.css
          git diff --cached --quiet && exit 0
          git commit -m 'Refine real-photo image framing'
          git push