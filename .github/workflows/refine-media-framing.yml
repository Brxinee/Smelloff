name: Refine real-photo framing

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refine-media-framing.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refine shared media framing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = Path('assets/css/chrome.css')
          text = css.read_text(encoding='utf-8')

          old = '''.so-media{
  margin:0;
  width:100%;
  overflow:hidden;
  border-radius:var(--so-radius-md, 6px);
  border:1px solid var(--so-chrome-line, rgba(255,255,255,.08));
  background:var(--so-chrome-2, #111111);
}
.so-media picture{
  display:block;
  width:100%;
  height:100%;
}
.so-media img{
  width:100%;
  height:auto;
  max-height:560px;
  display:block;
  object-fit:contain;
  object-position:center;
  object-position:center;
  border-radius:0;
}
@media(min-width:768px){
  .so-media img{
    max-height:none;
    height:100%;
    min-height:340px;
  }
}'''

          new = '''.so-media{
  margin:0;
  width:100%;
  aspect-ratio:4 / 5;
  overflow:hidden;
  border-radius:0;
  border:0;
  background:transparent;
}
.so-media picture{
  display:block;
  width:100%;
  height:100%;
}
.so-media img{
  width:100%;
  height:100%;
  max-height:none;
  display:block;
  object-fit:cover;
  object-position:center;
  border-radius:0;
}
@media(min-width:768px){
  .so-media{
    aspect-ratio:4 / 5;
  }
}'''

          if old not in text:
              raise SystemExit('Expected media block not found; refusing to patch blindly.')

          text = text.replace(old, new, 1)
          css.write_text(text, encoding='utf-8')
          PY

      - name: Commit and clean up
        run: |
          rm -f .github/workflows/refine-media-framing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/chrome.css .github/workflows/refine-media-framing.yml
          git commit -m 'Refine real-photo media framing'
          git push